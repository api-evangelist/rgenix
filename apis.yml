aid: rgenix
name: Rgenix
description: 'Rgenix, Inc. is a clinical-stage biopharmaceutical company founded by scientists from
  The Rockefeller University to discover and develop first-in-class small molecules and biologics
  against previously undruggable drivers of cancer metastasis, using its proprietary RNA-DRIVEr
  target-discovery platform. Its programs include ompenaclid (RGX-202), an oral SLC6A8/creatine-transporter
  inhibitor in Phase 2 for RAS-mutant colorectal cancer, abequolixron (RGX-104), an oral LXR agonist
  in Phase 1b/2, and RGX-019-MMAE, a MERTK-targeting antibody-drug conjugate. The company changed its
  corporate name from Rgenix to Inspirna in September 2021 and operates from Long Island City, New York.
  It is a therapeutics developer with no public API, developer program, or machine-readable interface.'
